<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川大学吴玉章哲学联队 - 足球战力值榜单</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 登录界面样式 */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-box {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(2, 8, 20, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        .login-box h1 {
            color: #5eead4;
            margin-bottom: 30px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(94, 234, 212, 0.3);
        }

        .login-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #0d9488 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 管理员登录表单 */
        .admin-login-form {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.3);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(94, 234, 212, 0.3);
            border-radius: 5px;
            font-size: 14px;
            color: #e2e8f0;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5eead4;
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.2);
        }

        /* 主界面样式 */
        .header {
            background: linear-gradient(135deg, #0c4a6e 0%, #0d9488 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(12, 74, 110, 0.4);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(45deg, transparent 49%, rgba(94, 234, 212, 0.1) 50%, transparent 51%),
                linear-gradient(-45deg, transparent 49%, rgba(94, 234, 212, 0.1) 50%, transparent 51%);
            background-size: 20px 20px;
            opacity: 0.3;
            z-index: 0;
        }

        .header h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            text-align: center;
            font-size: 16px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .user-info {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(94, 234, 212, 0.2);
            z-index: 1;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        .nav-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: transparent;
            border: 1px solid rgba(94, 234, 212, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            color: #cbd5e1;
            position: relative;
            overflow: hidden;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #0ea5e9 0%, #0d9488 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .nav-tab:hover:not(.active) {
            background: rgba(94, 234, 212, 0.1);
        }

        /* 内容区域 */
        .content {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(2, 8, 20, 0.3);
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        /* 排行榜样式 */
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .ranking-table th,
        .ranking-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .ranking-table th {
            background: linear-gradient(135deg, #0c4a6e 0%, #0d9488 100%);
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        .ranking-table tr:hover {
            background: rgba(94, 234, 212, 0.05);
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0ea5e9;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }

        .rank-change {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .rank-up {
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.3);
        }

        .rank-down {
            color: #f87171;
            text-shadow: 0 0 5px rgba(248, 113, 113, 0.3);
        }

        .rank-same {
            color: #94a3b8;
        }

        /* 球员详情模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin: 50px auto;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            border-radius: 15px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(94, 234, 212, 0.3);
            box-shadow: 0 25px 50px rgba(2, 8, 20, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #5eead4;
            transform: scale(1.1);
        }

        .player-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .radar-chart-container {
            width: 300px;
            height: 300px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 50%;
            padding: 15px;
        }

        .player-info h3 {
            color: #5eead4;
            margin-bottom: 15px;
            font-size: 24px;
            border-bottom: 2px solid #0ea5e9;
            padding-bottom: 10px;
        }

        .player-info p {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .player-info strong {
            color: #5eead4;
        }

        /* 管理界面样式 */
        .admin-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .player-form {
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(94, 234, 212, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .player-form h3 {
            margin-bottom: 20px;
            color: #5eead4;
            border-bottom: 2px solid #0ea5e9;
            padding-bottom: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .ability-inputs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .ability-input {
            text-align: center;
        }

        .ability-input label {
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
            color: #cbd5e1;
        }

        .ability-input input {
            width: 100%;
            padding: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(94, 234, 212, 0.3);
            border-radius: 5px;
            text-align: center;
            color: #e2e8f0;
            transition: all 0.3s;
        }

        .ability-input input:focus {
            border-color: #5eead4;
            box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.3);
        }

        .player-list {
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(94, 234, 212, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .player-list h3 {
            margin-bottom: 20px;
            color: #5eead4;
            border-bottom: 2px solid #0ea5e9;
            padding-bottom: 10px;
        }

        .player-item {
            background: rgba(30, 41, 59, 0.7);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid rgba(94, 234, 212, 0.1);
        }

        .player-item:hover {
            transform: translateY(-3px);
            border-color: rgba(94, 234, 212, 0.3);
            box-shadow: 0 5px 15px rgba(2, 8, 20, 0.3);
        }

        .player-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0ea5e9;
        }

        .player-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 5px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            color: white;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 特性标签 */
        .traits-container {
            margin-top: 15px;
        }

        .traits-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .trait-tag {
            background: linear-gradient(135deg, #0ea5e9 0%, #0d9488 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(14, 165, 233, 0.2);
        }

        .trait-tag .remove-trait {
            cursor: pointer;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .trait-tag .remove-trait:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .trait-input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .trait-input {
            flex: 1;
            padding: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(94, 234, 212, 0.3);
            border-radius: 5px;
            color: #e2e8f0;
            transition: all 0.3s;
        }

        .trait-input:focus {
            border-color: #5eead4;
            box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .admin-panel {
                grid-template-columns: 1fr;
            }

            .player-details {
                grid-template-columns: 1fr;
            }

            .ability-inputs {
                grid-template-columns: repeat(3, 1fr);
            }

            .nav-tabs {
                flex-direction: column;
            }

            .ranking-table {
                font-size: 14px;
            }

            .ranking-table th,
            .ranking-table td {
                padding: 8px 4px;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 提示消息 */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 2000;
            animation: slideIn 0.3s ease-out;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .message.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .message.info {
            background: linear-gradient(135deg, #0ea5e9 0%, #0d9488 100%);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #0c4a6e 0%, #0d9488 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(12, 74, 110, 0.3);
            transition: all 0.3s;
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(12, 74, 110, 0.4);
        }

        .stat-card h4 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            color: #a5f3fc;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(94, 234, 212, 0.3);
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>🦁 四川大学吴玉章哲学联队</h1>
            <h2 style="margin-bottom: 30px; color: #666;">足球战力值榜单系统</h2>
            <div class="login-buttons">
                <button class="btn btn-primary" onclick="showAdminLogin()">管理员登录</button>
                <button class="btn btn-secondary" onclick="guestLogin()">游客登录</button>
            </div>
            
            <div id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminUsername">管理员账号：</label>
                    <input type="text" id="adminUsername" placeholder="请输入管理员账号">
                </div>
                <div class="form-group">
                    <label for="adminPassword">管理员密码：</label>
                    <input type="password" id="adminPassword" placeholder="请输入管理员密码">
                </div>
                <button class="btn btn-primary" onclick="adminLogin()" style="width: 100%;">确认登录</button>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" class="hidden">
        <div class="container">
            <div class="header">
                <h1>🏆 四川大学吴玉章哲学联队 - 足球战力值榜单</h1>
                <p>展示球员实力，记录荣耀时刻</p>
                <div class="user-info">
                    <span id="userDisplay"></span>
                    <button class="logout-btn" onclick="logout()">退出登录</button>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <h4>球员总数</h4>
                    <div class="value" id="totalPlayers">0</div>
                </div>
                <div class="stat-card">
                    <h4>平均战力值</h4>
                    <div class="value" id="avgRating">0</div>
                </div>
                <div class="stat-card">
                    <h4>最高战力值</h4>
                    <div class="value" id="maxRating">0</div>
                </div>
                <div class="stat-card">
                    <h4>最低战力值</h4>
                    <div class="value" id="minRating">0</div>
                </div>
            </div>

            <!-- 导航标签 -->
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="showTab('ranking')">战力排行榜</div>
                <div class="nav-tab" id="adminTab" onclick="showTab('admin')">球员管理</div>
            </div>

            <!-- 内容区域 -->
            <div class="content">
                <!-- 排行榜界面 -->
                <div id="rankingTab" class="tab-content">
                    <h2>球员战力排行榜</h2>
                    <p style="color: #666; margin-bottom: 20px;">点击球员姓名查看详细信息</p>
                    
                    <div style="overflow-x: auto;">
                        <table class="ranking-table" id="rankingTable">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>头像</th>
                                    <th>姓名</th>
                                    <th>位置</th>
                                    <th>综合战力</th>
                                    <th>排名变化</th>
                                    <th>战力变化</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="rankingBody">
                                <!-- 动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 管理界面 -->
                <div id="adminTab" class="tab-content hidden">
                    <div class="admin-panel">
                        <div class="player-form">
                            <h3 id="formTitle">添加球员</h3>
                            <form id="playerForm">
                                <input type="hidden" id="playerId">
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="playerName">球员姓名：</label>
                                        <input type="text" id="playerName" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="playerPosition">位置：</label>
                                        <select id="playerPosition" required>
                                            <option value="">请选择位置</option>
                                            <option value="前锋">前锋</option>
                                            <option value="中场">中场</option>
                                            <option value="后卫">后卫</option>
                                            <option value="门将">门将</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="playerAvatar">头像URL：</label>
                                        <input type="url" id="playerAvatar" placeholder="请输入头像图片链接">
                                    </div>
                                    <div class="form-group">
                                        <label for="preferredFoot">惯用脚：</label>
                                        <select id="preferredFoot" required>
                                            <option value="">请选择</option>
                                            <option value="左脚">左脚</option>
                                            <option value="右脚">右脚</option>
                                            <option value="双脚">双脚</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group full-width">
                                    <label>能力值（1-100）：</label>
                                    <div class="ability-inputs">
                                        <div class="ability-input">
                                            <label>射门</label>
                                            <input type="number" id="shooting" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>传球</label>
                                            <input type="number" id="passing" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>拦截</label>
                                            <input type="number" id="defending" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>速度</label>
                                            <input type="number" id="pace" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>意识</label>
                                            <input type="number" id="awareness" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>盘带</label>
                                            <input type="number" id="dribbling" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>积极性</label>
                                            <input type="number" id="workRate" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>身体</label>
                                            <input type="number" id="physical" min="1" max="100" value="50">
                                        </div>
                                        <div class="ability-input">
                                            <label>健康</label>
                                            <input type="number" id="fitness" min="1" max="100" value="50">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group full-width">
                                    <label>球员特性：</label>
                                    <div class="traits-container">
                                        <div class="traits-list" id="traitsList"></div>
                                        <div class="trait-input-group">
                                            <input type="text" class="trait-input" id="traitInput" placeholder="添加特性（如：速度型、技术型、团队型等）">
                                            <button type="button" class="btn btn-primary" onclick="addTrait()">添加</button>
                                        </div>
                                    </div>
                                </div>

                                <div style="display: flex; gap: 10px; margin-top: 20px;">
                                    <button type="submit" class="btn btn-primary" style="flex: 1;">保存球员</button>
                                    <button type="button" class="btn btn-secondary" onclick="resetForm()" style="flex: 1;">重置</button>
                                </div>
                            </form>
                        </div>

                        <div class="player-list">
                            <h3>球员列表</h3>
                            <div id="playersList">
                                <!-- 动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 球员详情模态框 -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalPlayerName"></h2>
            <div class="player-details">
                <div class="player-info">
                    <img id="modalPlayerAvatar" src="" alt="球员头像" style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 20px;">
                    <p><strong>位置：</strong><span id="modalPlayerPosition"></span></p>
                    <p><strong>惯用脚：</strong><span id="modalPreferredFoot"></span></p>
                    <p><strong>综合战力：</strong><span id="modalOverallRating"></span></p>
                    <div id="modalTraits" style="margin-top: 20px;">
                        <strong>球员特性：</strong>
                        <div class="traits-list" id="modalTraitsList"></div>
                    </div>
                </div>
                <div class="radar-chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentUser = null;
        let players = [];
        let previousRankings = {};
        let radarChart = null;
        let currentTraits = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadDataFromStorage();
            updateStats();
        });

        // 从本地存储加载数据
        function loadDataFromStorage() {
            const storedPlayers = localStorage.getItem('scuPlayers');
            const storedRankings = localStorage.getItem('scuPreviousRankings');
            const storedUser = localStorage.getItem('scuCurrentUser');
            
            if (storedPlayers) {
                players = JSON.parse(storedPlayers);
            }
            
            if (storedRankings) {
                previousRankings = JSON.parse(storedRankings);
            }
            
            if (storedUser) {
                currentUser = storedUser;
                showMainApp();
            }
        }

        // 保存数据到本地存储
        function saveDataToStorage() {
            localStorage.setItem('scuPlayers', JSON.stringify(players));
            localStorage.setItem('scuPreviousRankings', JSON.stringify(previousRankings));
            localStorage.setItem('scuCurrentUser', currentUser);
        }

        // 显示管理员登录表单
        function showAdminLogin() {
            document.getElementById('adminLoginForm').style.display = 'block';
        }

        // 管理员登录
        function adminLogin() {
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            
            if (username === 'lmx' && password === '040609') {
                currentUser = 'admin';
                saveDataToStorage();
                showMessage('管理员登录成功！', 'success');
                showMainApp();
            } else {
                showMessage('账号或密码错误！', 'error');
            }
        }

        // 游客登录
        function guestLogin() {
            currentUser = 'guest';
            saveDataToStorage();
            showMessage('游客登录成功！', 'success');
            showMainApp();
        }

        // 显示主应用
        function showMainApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            // 更新用户显示
            const userDisplay = document.getElementById('userDisplay');
            if (currentUser === 'admin') {
                userDisplay.textContent = '管理员：lmx';
                document.getElementById('adminTab').style.display = 'block';
            } else {
                userDisplay.textContent = '游客模式';
                document.getElementById('adminTab').style.display = 'none';
            }
            
            // 初始化数据
            updateRanking();
            updatePlayersList();
            updateStats();
        }

        // 退出登录
        function logout() {
            currentUser = null;
            localStorage.removeItem('scuCurrentUser');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('adminUsername').value = '';
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminLoginForm').style.display = 'none';
        }

        // 显示消息
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // 切换标签
        function showTab(tabName) {
            // 隐藏所有标签内容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // 移除所有标签的激活状态
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 显示选中的标签
            document.getElementById(tabName + 'Tab').classList.remove('hidden');
            
            // 激活选中的标签
            event.target.classList.add('active');
            
            // 如果切换到排行榜，更新数据
            if (tabName === 'ranking') {
                updateRanking();
            }
        }

        // 计算综合战力
        function calculateOverallRating(player) {
            const abilities = [
                player.shooting,
                player.passing,
                player.defending,
                player.pace,
                player.awareness,
                player.dribbling,
                player.workRate,
                player.physical,
                player.fitness
            ];
            
            return Math.round(abilities.reduce((sum, ability) => sum + ability, 0) / abilities.length);
        }

        // 更新排行榜
        function updateRanking() {
            const rankingBody = document.getElementById('rankingBody');
            rankingBody.innerHTML = '';
            
            if (players.length === 0) {
                rankingBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #666;">暂无球员数据</td></tr>';
                return;
            }
            
            // 计算综合战力并排序
            const playersWithRating = players.map(player => ({
                ...player,
                overallRating: calculateOverallRating(player)
            }));
            
            playersWithRating.sort((a, b) => b.overallRating - a.overallRating);
            
            // 保存当前排名用于比较
            const currentRankings = {};
            playersWithRating.forEach((player, index) => {
                currentRankings[player.id] = index + 1;
            });
            
            // 生成排行榜
            playersWithRating.forEach((player, index) => {
                const row = document.createElement('tr');
                const previousRank = previousRankings[player.id] || 0;
                const rankChange = previousRank ? previousRank - (index + 1) : 0;
                const ratingChange = player.previousRating ? player.overallRating - player.previousRating : 0;
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><img src="${player.avatar || 'https://via.placeholder.com/50'}" alt="${player.name}" class="player-avatar"></td>
                    <td><a href="#" onclick="showPlayerDetails(${player.id}); return false;" style="color: #3498db; text-decoration: none;">${player.name}</a></td>
                    <td>${player.position}</td>
                    <td><strong>${player.overallRating}</strong></td>
                    <td>${getRankChangeHtml(rankChange)}</td>
                    <td>${getRatingChangeHtml(ratingChange)}</td>
                    <td>
                        ${currentUser === 'admin' ? 
                            `<button class="btn-small btn-edit" onclick="editPlayer(${player.id})">编辑</button>
                             <button class="btn-small btn-delete" onclick="deletePlayer(${player.id})">删除</button>` : 
                            `<button class="btn-small btn-primary" onclick="showPlayerDetails(${player.id})">查看</button>`
                        }
                    </td>
                `;
                
                rankingBody.appendChild(row);
            });
            
            // 更新之前的排名数据
            Object.assign(previousRankings, currentRankings);
            playersWithRating.forEach(player => {
                const originalPlayer = players.find(p => p.id === player.id);
                if (originalPlayer) {
                    originalPlayer.previousRating = player.overallRating;
                }
            });
            
            saveDataToStorage();
        }

        // 获取排名变化HTML
        function getRankChangeHtml(change) {
            if (change === 0) {
                return '<span class="rank-change rank-same">-</span>';
            } else if (change > 0) {
                return `<span class="rank-change rank-up">↑ ${change}</span>`;
            } else {
                return `<span class="rank-change rank-down">↓ ${Math.abs(change)}</span>`;
            }
        }

        // 获取评分变化HTML
        function getRatingChangeHtml(change) {
            if (change === 0) {
                return '<span class="rank-change rank-same">-</span>';
            } else if (change > 0) {
                return `<span class="rank-change rank-up">+${change}</span>`;
            } else {
                return `<span class="rank-change rank-down">${change}</span>`;
            }
        }

        // 显示球员详情
        function showPlayerDetails(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;
            
            const overallRating = calculateOverallRating(player);
            
            // 填充模态框数据
            document.getElementById('modalPlayerName').textContent = player.name;
            document.getElementById('modalPlayerAvatar').src = player.avatar || 'https://via.placeholder.com/100';
            document.getElementById('modalPlayerPosition').textContent = player.position;
            document.getElementById('modalPreferredFoot').textContent = player.preferredFoot;
            document.getElementById('modalOverallRating').textContent = overallRating;
            
            // 显示特性
            const modalTraitsList = document.getElementById('modalTraitsList');
            modalTraitsList.innerHTML = '';
            if (player.traits && player.traits.length > 0) {
                player.traits.forEach(trait => {
                    const traitTag = document.createElement('div');
                    traitTag.className = 'trait-tag';
                    traitTag.textContent = trait;
                    modalTraitsList.appendChild(traitTag);
                });
            }
            
            // 显示雷达图
            showRadarChart(player);
            
            // 显示模态框
            document.getElementById('playerModal').style.display = 'block';
        }

        // 显示雷达图
        function showRadarChart(player) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            if (radarChart) {
                radarChart.destroy();
            }
            
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['射门', '传球', '拦截', '速度', '意识', '盘带', '积极性', '身体', '健康'],
                    datasets: [{
                        label: player.name,
                        data: [
                            player.shooting,
                            player.passing,
                            player.defending,
                            player.pace,
                            player.awareness,
                            player.dribbling,
                            player.workRate,
                            player.physical,
                            player.fitness
                        ],
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(52, 152, 219, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(52, 152, 219, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('playerModal').style.display = 'none';
            if (radarChart) {
                radarChart.destroy();
                radarChart = null;
            }
        }

        // 添加特性
        function addTrait() {
            const traitInput = document.getElementById('traitInput');
            const trait = traitInput.value.trim();
            
            if (trait && !currentTraits.includes(trait)) {
                currentTraits.push(trait);
                updateTraitsList();
                traitInput.value = '';
                showMessage('特性添加成功！', 'success');
            } else if (currentTraits.includes(trait)) {
                showMessage('该特性已存在！', 'error');
            }
        }

        // 更新特性列表显示
        function updateTraitsList() {
            const traitsList = document.getElementById('traitsList');
            traitsList.innerHTML = '';
            
            currentTraits.forEach((trait, index) => {
                const traitTag = document.createElement('div');
                traitTag.className = 'trait-tag';
                traitTag.innerHTML = `
                    ${trait}
                    <span class="remove-trait" onclick="removeTrait(${index})">×</span>
                `;
                traitsList.appendChild(traitTag);
            });
        }

        // 移除特性
        function removeTrait(index) {
            currentTraits.splice(index, 1);
            updateTraitsList();
            showMessage('特性已移除！', 'info');
        }

        // 重置表单
        function resetForm() {
            document.getElementById('playerForm').reset();
            document.getElementById('playerId').value = '';
            document.getElementById('formTitle').textContent = '添加球员';
            currentTraits = [];
            updateTraitsList();
        }

        // 提交球员表单
        document.getElementById('playerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const playerId = document.getElementById('playerId').value;
            const playerData = {
                name: document.getElementById('playerName').value.trim(),
                position: document.getElementById('playerPosition').value,
                avatar: document.getElementById('playerAvatar').value.trim(),
                preferredFoot: document.getElementById('preferredFoot').value,
                shooting: parseInt(document.getElementById('shooting').value),
                passing: parseInt(document.getElementById('passing').value),
                defending: parseInt(document.getElementById('defending').value),
                pace: parseInt(document.getElementById('pace').value),
                awareness: parseInt(document.getElementById('awareness').value),
                dribbling: parseInt(document.getElementById('dribbling').value),
                workRate: parseInt(document.getElementById('workRate').value),
                physical: parseInt(document.getElementById('physical').value),
                fitness: parseInt(document.getElementById('fitness').value),
                traits: [...currentTraits]
            };
            
            if (playerId) {
                // 编辑现有球员
                const index = players.findIndex(p => p.id == playerId);
                if (index !== -1) {
                    players[index] = { ...players[index], ...playerData };
                    showMessage('球员信息更新成功！', 'success');
                }
            } else {
                // 添加新球员
                playerData.id = Date.now();
                playerData.previousRating = null;
                players.push(playerData);
                showMessage('球员添加成功！', 'success');
            }
            
            saveDataToStorage();
            updateRanking();
            updatePlayersList();
            updateStats();
            resetForm();
        });

        // 编辑球员
        function editPlayer(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;
            
            // 填充表单
            document.getElementById('playerId').value = player.id;
            document.getElementById('playerName').value = player.name;
            document.getElementById('playerPosition').value = player.position;
            document.getElementById('playerAvatar').value = player.avatar || '';
            document.getElementById('preferredFoot').value = player.preferredFoot;
            document.getElementById('shooting').value = player.shooting;
            document.getElementById('passing').value = player.passing;
            document.getElementById('defending').value = player.defending;
            document.getElementById('pace').value = player.pace;
            document.getElementById('awareness').value = player.awareness;
            document.getElementById('dribbling').value = player.dribbling;
            document.getElementById('workRate').value = player.workRate;
            document.getElementById('physical').value = player.physical;
            document.getElementById('fitness').value = player.fitness;
            
            // 设置特性
            currentTraits = player.traits ? [...player.traits] : [];
            updateTraitsList();
            
            // 更新表单标题
            document.getElementById('formTitle').textContent = '编辑球员';
            
            // 切换到管理标签
            showTab('admin');
            document.querySelector('.nav-tab:last-child').classList.add('active');
            document.querySelector('.nav-tab:first-child').classList.remove('active');
        }

        // 删除球员
        function deletePlayer(playerId) {
            if (confirm('确定要删除该球员吗？')) {
                players = players.filter(p => p.id !== playerId);
                delete previousRankings[playerId];
                saveDataToStorage();
                updateRanking();
                updatePlayersList();
                updateStats();
                showMessage('球员删除成功！', 'success');
            }
        }

        // 更新球员列表
        function updatePlayersList() {
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '';
            
            if (players.length === 0) {
                playersList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">暂无球员数据</p>';
                return;
            }
            
            players.forEach(player => {
                const overallRating = calculateOverallRating(player);
                
                const playerItem = document.createElement('div');
                playerItem.className = 'player-item';
                playerItem.innerHTML = `
                    <div class="player-item-info">
                        <img src="${player.avatar || 'https://via.placeholder.com/40'}" alt="${player.name}">
                        <div>
                            <div style="font-weight: bold;">${player.name}</div>
                            <div style="font-size: 12px; color: #666;">${player.position} | 综合战力: ${overallRating}</div>
                        </div>
                    </div>
                    <div class="player-actions">
                        <button class="btn-small btn-edit" onclick="editPlayer(${player.id})">编辑</button>
                        <button class="btn-small btn-delete" onclick="deletePlayer(${player.id})">删除</button>
                    </div>
                `;
                
                playersList.appendChild(playerItem);
            });
        }

        // 更新统计数据
        function updateStats() {
            const totalPlayers = players.length;
            document.getElementById('totalPlayers').textContent = totalPlayers;
            
            if (totalPlayers === 0) {
                document.getElementById('avgRating').textContent = '0';
                document.getElementById('maxRating').textContent = '0';
                document.getElementById('minRating').textContent = '0';
                return;
            }
            
            const ratings = players.map(player => calculateOverallRating(player));
            const avgRating = Math.round(ratings.reduce((sum, rating) => sum + rating, 0) / totalPlayers);
            const maxRating = Math.max(...ratings);
            const minRating = Math.min(...ratings);
            
            document.getElementById('avgRating').textContent = avgRating;
            document.getElementById('maxRating').textContent = maxRating;
            document.getElementById('minRating').textContent = minRating;
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('playerModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // 键盘事件
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
